<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PikaChef - Recetas del Mundo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/mswtpv.jpg">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <a href="#" class="flex items-center gap-3 group">
                <img src="https://files.catbox.moe/mswtpv.jpg" alt="PikaChef Logo" class="h-12 w-12 object-cover rounded-full border border-amber-500/30 transition-transform duration-200 group-hover:scale-105">
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent leading-tight">PikaChef</h1>
                    <p class="text-[10px] tracking-wider text-slate-400 uppercase font-medium">Tu recetario online</p>
                </div>
            </a>
            
            <button class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
                ❤️ Favoritos <span id="fav-count" class="bg-amber-500 text-slate-900 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-gradient-to-r from-slate-800 to-slate-800/50 p-6 md:p-10 rounded-2xl border border-slate-700 mb-8 relative overflow-hidden flex items-center justify-between">
            <div class="max-w-2xl relative z-10">
                <span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-wider">RECETARIO CHEF</span>
                <h2 class="text-3xl md:text-5xl font-extrabold mt-3 mb-4">55 Recetas Explicadas Paso a Paso</h2>
                <p class="text-slate-300 text-sm md:text-base">Explora platillos peruanos, desayunos energéticos y clásicos internacionales con ingredientes interactivos y guía estructurada paso a paso.</p>
            </div>
            
            <div class="hidden md:block relative z-0 opacity-20 pointer-events-none w-44 h-44 ml-4 flex-shrink-0">
                <img src="https://files.catbox.moe/mswtpv.jpg" alt="Mascota PikaChef" class="w-full h-full object-cover rounded-full">
            </div>
        </div>

        <!-- Buscador y Filtros -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-1">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                <input type="text" id="search-input" placeholder="Buscar receta o ingrediente..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition-colors">
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0" id="filter-buttons">
                <button class="filter-btn active bg-amber-500 text-slate-900 font-semibold px-5 py-3 rounded-xl text-sm whitespace-nowrap transition-all" data-category="Todas">Todas</button>
                <button class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl text-sm whitespace-nowrap transition-all border border-slate-700" data-category="Comidas Peruanas">Comidas Peruanas</button>
                <button class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl text-sm whitespace-nowrap transition-all border border-slate-700" data-category="Desayunos">Desayunos</button>
                <button class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl text-sm whitespace-nowrap transition-all border border-slate-700" data-category="Comidas Extranjeras">Comidas Extranjeras</button>
            </div>
        </div>

        <!-- Grid de Recetas -->
        <div id="recipes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Carga dinámica desde JS -->
        </div>
    </main>

    <!-- Modal de Receta en Detalle -->
    <div id="recipe-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <button id="close-modal" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-900 text-slate-300 hover:text-white p-2 rounded-full z-10 transition-colors">
                ✖
            </button>
            
            <div class="relative h-64 sm:h-72">
                <img id="modal-img" src="" alt="Receta" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-800 via-transparent to-transparent"></div>
                <div class="absolute bottom-4 left-6 right-6">
                    <span id="modal-category" class="text-xs font-semibold text-amber-400 uppercase tracking-wider"></span>
                    <h2 id="modal-title" class="text-2xl sm:text-3xl font-bold text-white mt-1"></h2>
                    <p id="modal-time" class="text-slate-300 text-sm mt-1">⏱️ <span></span></p>
                </div>
            </div>

            <div class="p-6 space-y-6">
                <!-- Ingredientes -->
                <div>
                    <h3 class="text-lg font-bold text-amber-400 border-b border-slate-700 pb-2 mb-3">Ingredientes</h3>
                    <ul id="modal-ingredients" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-300">
                        <!-- Carga dinámica -->
                    </ul>
                </div>

                <!-- Preparación -->
                <div>
                    <h3 class="text-lg font-bold text-amber-400 border-b border-slate-700 pb-2 mb-3">Preparación Paso a Paso</h3>
                    <div id="modal-steps" class="space-y-4">
                        <!-- Carga dinámica -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Elemento de Audio de Respaldo -->
    <audio id="bg-music" loop crossorigin="anonymous">
        <source src="https://files.catbox.moe/eixg9d.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón Flotante para Música -->
    <button id="bg-music-toggle" onclick="toggleMusicaFondo()" class="fixed bottom-5 right-5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-all cursor-pointer">
        <span id="bg-music-icon">🎵</span>
        <span id="bg-music-text" class="text-xs font-bold">Música: OFF</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
